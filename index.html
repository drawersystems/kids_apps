<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#26113e"><title>Jump on the Ghost — Boo's Pumpkin Patch V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d0e30;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:6px;pointer-events:none;font-weight:900;font-size:15px;text-shadow:0 2px 3px #210b32}#hud span,#pause{background:#3c1b64d9;padding:9px 11px;border-radius:13px}button{border:0;color:white;font-weight:900;touch-action:none;-webkit-tap-highlight-color:transparent}#pause{pointer-events:auto;font-size:19px}
#controls{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:none;gap:10px}
.cluster{display:flex;align-items:end;gap:8px;pointer-events:auto}.ctl{width:clamp(57px,17vw,82px);height:clamp(57px,17vw,82px);border-radius:22px;background:#7543aee8;border:3px solid #bc8bea;font-size:28px;box-shadow:0 5px 0 #3a1b62;cursor:pointer}.ctl:active,.ctl.pressed{background:#c15dd0;transform:translateY(3px);box-shadow:0 2px 0 #3a1b62}#jump{background:#ef822f;border-color:#ffcb7a;font-size:17px;width:clamp(76px,21vw,100px)}#up{font-size:15px}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#170b2cce;padding:18px}#overlay.hidden{display:none}#panel{max-width:420px;width:100%;background:#50246f;border:3px solid #ffbd65;border-radius:28px;text-align:center;padding:24px;box-shadow:0 12px 45px #0009}h1{font-size:32px;color:#ffca6d;margin:0 0 12px}p{line-height:1.5}#play{background:#f08a31;border-radius:18px;padding:14px 34px;font-size:22px}#controls.hidden{display:none}
</style></head><body>
<canvas id="game" aria-label="Halloween platform game"></canvas>
<div id="hud"><span id="points">⭐ 0</span><span id="treats">🍬 0/6 • 💎 0/2</span><span id="lives">❤️❤️❤️</span><button id="pause" aria-label="Pause game">Ⅱ</button></div>
<div id="controls" class="hidden"><div class="cluster"><button class="ctl" data-key="left" aria-label="Move left">◀</button><button class="ctl" data-key="right" aria-label="Move right">▶</button></div><div class="cluster"><button class="ctl" id="up" data-key="up" aria-label="Climb ladder">▲<div style="font-size:11px">CLIMB</div></button><button class="ctl" id="jump" data-key="jump" aria-label="Jump">JUMP</button></div></div>
<div id="overlay"><div id="panel"><h1 id="heading">🎃 Jump on the Ghost!</h1><p id="message">Boo's Halloween Adventure — 3 Levels<br><br>Run, jump, and climb! One hit turns Boo into Baby Boo. A second hit restarts the current level. Collect candy and gems, avoid monsters and webs, and reach the glowing door at the top!</p><button id="play">Play!</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),controls=document.getElementById('controls'),points=document.getElementById('points'),treats=document.getElementById('treats'),lives=document.getElementById('lives'),pauseBtn=document.getElementById('pause');
const WW=400,HH=720, floors=[650,510,370,230],ladders=[{x:345,from:0},{x:55,from:1},{x:345,from:2}], keys={left:false,right:false,up:false,jump:false};
let baby=false, side=null, level=1, totalLevels=3, gems=[], hazards=[], player,monsters,candies,pumpkins,score,hearts,mode='menu',jumpLatch=false,climbLatch=false,last=0,acc=0,clock=0,invincible=0;
function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);ctx.setTransform(1,0,0,1,0,0)}
addEventListener('resize',resize);resize();
function setupLevel(){baby=false;if(level===2){setupSide();return}side=null;
player={x:60,y:floors[0],vy:0,ground:0,climb:-1,face:1};
const configs=[
{monsters:[{x:205,f:1,speed:38},{x:195,f:2,speed:52},{x:175,f:3,speed:43}],pumpkins:[{x:205,f:0},{x:275,f:1},{x:155,f:2},{x:240,f:3}],hazards:[{x:290,f:2,type:'🕸️'}]},
{monsters:[{x:260,f:0,speed:54},{x:190,f:1,speed:65},{x:210,f:2,speed:68},{x:160,f:3,speed:58}],pumpkins:[{x:170,f:0},{x:255,f:1},{x:130,f:2},{x:275,f:3}],hazards:[{x:240,f:0,type:'🕸️'},{x:295,f:2,type:'🕸️'}]},
{monsters:[{x:230,f:0,speed:72},{x:170,f:1,speed:72},{x:240,f:2,speed:78},{x:155,f:3,speed:75}],pumpkins:[{x:180,f:0},{x:265,f:1},{x:150,f:2},{x:255,f:3}],hazards:[{x:290,f:0,type:'🕸️'},{x:195,f:1,type:'🕸️'},{x:295,f:2,type:'🕸️'}]}
];
let cfg=configs[level-1];
monsters=cfg.monsters.map((m,i)=>({...m,dir:i%2?-1:1,type:['💀','🧟','🦇','💀'][i]}));
pumpkins=cfg.pumpkins;hazards=cfg.hazards;
candies=[{x:120,f:0},{x:315,f:0},{x:205,f:1},{x:95,f:2},{x:260,f:2},{x:85,f:3}].map(c=>({...c,taken:false}));
gems=[{x:315,f:1,taken:false},{x:205,f:3,taken:false}];
clock=0;invincible=2;jumpLatch=false;climbLatch=false;
for(const k in keys)keys[k]=false;
mode='play';overlay.classList.add('hidden');controls.classList.remove('hidden');pauseBtn.textContent='Ⅱ';updateHud();
}
function init(){level=1;score=0;hearts=3;setupLevel()}
function updateHud(){points.textContent='⭐ '+score;treats.textContent='🍬 '+(level===2?side.items.filter(c=>c.taken).length+'/'+side.items.length:candies.filter(c=>c.taken).length+'/6 • 💎 '+gems.filter(g=>g.taken).length+'/2');lives.textContent=baby?'👶 BABY BOO':'👻 BIG BOO'}
function show(title,message,button){document.getElementById('heading').textContent=title;document.getElementById('message').innerHTML=message;document.getElementById('play').textContent=button;overlay.classList.remove('hidden');controls.classList.add('hidden')}
function lose(){if(invincible>0)return;if(!baby){baby=true;invincible=2.2;score=Math.max(0,score-20);updateHud();return}mode='over';show('👶 Baby Boo got caught!','Retry Level '+level+' from the beginning.<br>Score: '+score,'Retry Level')}
function win(){score+=500;updateHud();if(level<totalLevels){mode='between';show('🎉 Level '+level+' Complete!','Great job! Next up: '+['','The Haunted Forest','Skeleton Castle'][level]+'<br>Score: '+score,'Next Level');}else{mode='won';show('🏆 Boo Wins the Adventure!','You finished all 3 levels!<br>Final score: '+score,'Play Again')}}
document.getElementById('play').onclick=()=>{if(mode==='paused')resume();else if(mode==='between'){level++;setupLevel()}else if(mode==='over'){setupLevel()}else init()};
pauseBtn.onclick=()=>{if(mode==='play'){mode='paused';pauseBtn.textContent='▶';show('⏸ Paused','Boo is taking a little break.','Resume')}else if(mode==='paused')resume()};
function resume(){mode='play';overlay.classList.add('hidden');controls.classList.remove('hidden');pauseBtn.textContent='Ⅱ';last=performance.now()}

for(const b of document.querySelectorAll('[data-key]')){const key=b.dataset.key;const down=e=>{e.preventDefault();keys[key]=true;b.classList.add('pressed');try{b.setPointerCapture(e.pointerId)}catch(_){}};const up=e=>{e.preventDefault();keys[key]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)}
addEventListener('keydown',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',Space:'jump',' ':'jump',KeyA:'left',KeyD:'right',KeyW:'up'}[e.code]||({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up'}[e.key]);if(k){keys[k]=true;e.preventDefault()}});
addEventListener('keyup',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',Space:'jump',' ':'jump',KeyA:'left',KeyD:'right',KeyW:'up'}[e.code]||({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up'}[e.key]);if(k)keys[k]=false});

function setupSide(){baby=false;side={x:40,y:570,vy:0,ground:570,grounded:true,camera:0,length:3300,obstacles:[400,730,1110,1500,1900,2300,2750,3080],enemies:[600,950,1350,1720,2120,2550,2950].map((x,i)=>({x,base:x,dir:i%2?-1:1,speed:45+i*4,type:i%2?'🧟':'💀'})),items:[]};let kinds=[['🍬',10],['🍭',25],['🍫',50],['💎',100]];for(let x=150,i=0;x<3200;x+=110,i++){let k=kinds[i%4];side.items.push({x,y:570-(i%5===0?105:55),icon:k[0],value:k[1],taken:false})}invincible=2;clock=0;jumpLatch=false;for(let k in keys)keys[k]=false;mode='play';overlay.classList.add('hidden');controls.classList.remove('hidden');pauseBtn.textContent='Ⅱ';updateHud()}
function updateSide(dt){clock+=dt;if(invincible>0)invincible-=dt;let p=side,dir=(keys.right?1:0)-(keys.left?1:0);p.x=Math.max(20,Math.min(p.length-20,p.x+dir*195*dt));if(keys.jump&&!jumpLatch&&p.grounded){p.vy=-440;p.grounded=false}jumpLatch=keys.jump;if(!p.grounded){p.vy+=1000*dt;p.y+=p.vy*dt;if(p.y>=p.ground){p.y=p.ground;p.vy=0;p.grounded=true}}p.camera=Math.max(0,Math.min(p.length-400,p.x-145));for(let c of p.items)if(!c.taken&&Math.abs(p.x-c.x)<25&&Math.abs(p.y-20-c.y)<35){c.taken=true;score+=c.value;updateHud()}for(let m of p.enemies){m.x+=m.dir*m.speed*dt;if(Math.abs(m.x-m.base)>65)m.dir*=-1}if(invincible<=0){for(let x of p.obstacles)if(Math.abs(p.x-(x+15))<(baby?23:31)&&p.y>p.ground-40){lose();break}if(invincible<=0)for(let m of p.enemies)if(Math.abs(p.x-m.x)<(baby?19:25)&&p.y>p.ground-32){lose();break}}if(p.x>=p.length-65)win()}
function drawSide(){let d=Math.min(devicePixelRatio||1,2),cw=canvas.clientWidth,ch=canvas.clientHeight,sc=Math.min(cw/400,ch/720),ox=(cw-400*sc)/2,oy=(ch-720*sc)/2;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#201038';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(sc*d,0,0,sc*d,ox*d,oy*d);let g=ctx.createLinearGradient(0,0,0,720);g.addColorStop(0,'#21143c');g.addColorStop(1,'#83416e');ctx.fillStyle=g;ctx.fillRect(0,0,400,720);textEmoji('🌕',320,135,60);ctx.save();ctx.translate(-side.camera,0);for(let x=0;x<side.length;x+=230){textEmoji('🌲',x+40,565,100);textEmoji('🪦',x+155,563,38);textEmoji('🦇',x+105,300+(x%3)*23,26);textEmoji('🍂',x+200,550,23)}ctx.fillStyle='#503753';ctx.fillRect(0,570,side.length,150);ctx.fillStyle='#89bd5a';ctx.fillRect(0,563,side.length,12);for(let x of side.obstacles)textEmoji('🪦',x+15,563,48);for(let m of side.enemies)textEmoji(m.type,m.x,562,32);for(let c of side.items)if(!c.taken)textEmoji(c.icon,c.x,c.y+10,28);textEmoji('🏁',side.length-50,552,55);ghost(side.x,side.y);ctx.restore();ctx.fillStyle='#ffda84';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('LEVEL 2 • HAUNTED GRAVEYARD',200,110);ctx.fillRect(18,127,364*side.x/side.length,5)}
function update(dt){if(level===2){updateSide(dt);return}clock+=dt;if(invincible>0)invincible-=dt;
let dx=(keys.right?1:0)-(keys.left?1:0);if(dx)player.face=dx;
if(player.climb>=0){let l=ladders[player.climb];player.x=l.x;player.y-=150*dt;player.vy=0;if(player.y<=floors[l.from+1]){player.y=floors[l.from+1];player.ground=l.from+1;player.climb=-1;score+=100;updateHud()} }
else{
player.x=Math.max(20,Math.min(380,player.x+dx*185*dt));
if(keys.up&&!climbLatch&&player.ground>=0&&player.ground<3&&Math.abs(player.x-ladders[player.ground].x)<32&&Math.abs(player.y-floors[player.ground])<6){player.climb=player.ground;player.ground=-1;player.vy=0}
if(keys.jump&&!jumpLatch&&player.ground>=0){player.vy=-390;player.ground=-1}
if(player.ground<0&&player.climb<0){let oldY=player.y;player.vy+=950*dt;player.y+=player.vy*dt;if(player.vy>=0){for(let f=3;f>=0;f--){if(oldY<=floors[f]+3&&player.y>=floors[f]){player.y=floors[f];player.vy=0;player.ground=f;break}}}if(player.y>HH+30)lose()}
}
jumpLatch=keys.jump;climbLatch=keys.up;
if(mode!=='play')return;
for(const c of candies){if(!c.taken&&Math.abs(player.x-c.x)<23&&Math.abs(player.y-(floors[c.f]-28))<35){c.taken=true;score+=50;updateHud()}}
for(const g of gems){if(!g.taken&&Math.abs(player.x-g.x)<25&&Math.abs(player.y-(floors[g.f]-28))<36){g.taken=true;score+=150;updateHud()}}
for(const m of monsters){m.x+=m.dir*m.speed*dt;if(m.x>345){m.x=345;m.dir=-1}if(m.x<55){m.x=55;m.dir=1}}
if(invincible<=0&&player.climb<0){for(const p of pumpkins){if(Math.abs(player.x-p.x)<(baby?17:23)&&Math.abs(player.y-floors[p.f])<26){lose();break}}if(invincible<=0)for(const h of hazards){if(Math.abs(player.x-h.x)<(baby?15:20)&&Math.abs(player.y-floors[h.f])<22){lose();break}}if(invincible<=0)for(const m of monsters){if(Math.abs(player.x-m.x)<(baby?18:24)&&Math.abs(player.y-floors[m.f])<28){lose();break}}}
if(player.ground===3&&player.x<62)win();
}
function textEmoji(emoji,x,y,size=28){ctx.font=size+'px system-ui,Apple Color Emoji,Segoe UI Emoji';ctx.textAlign='center';ctx.fillText(emoji,x,y)}
function ghost(x,y){ctx.save();ctx.translate(x,y);if(baby)ctx.scale(.65,.65);if(invincible>0&&Math.floor(clock*9)%2===0)ctx.globalAlpha=.45;ctx.shadowColor='#ff93d8';ctx.shadowBlur=14;ctx.fillStyle='#ff9cdb';ctx.strokeStyle='#fff2fa';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-18,-4);ctx.arc(0,-17,18,Math.PI,0);ctx.lineTo(18,-4);ctx.lineTo(18,0);ctx.quadraticCurveTo(13,7,8,0);ctx.quadraticCurveTo(0,8,-7,0);ctx.quadraticCurveTo(-13,7,-18,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#34113e';ctx.beginPath();ctx.arc(-6,-18,3,0,7);ctx.arc(6,-18,3,0,7);ctx.fill();ctx.beginPath();ctx.arc(0,-10,4,0,Math.PI);ctx.strokeStyle='#34113e';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
function draw(){if(level===2){drawSide();return}const d=Math.min(devicePixelRatio||1,2),cw=canvas.clientWidth,ch=canvas.clientHeight;const scale=Math.min(cw/WW,ch/HH),ox=(cw-WW*scale)/2,oy=(ch-HH*scale)/2;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#1d0e30';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale*d,0,0,scale*d,ox*d,oy*d);
let bg=ctx.createLinearGradient(0,0,0,HH);bg.addColorStop(0,'#1e103e');bg.addColorStop(1,'#803365');ctx.fillStyle=bg;ctx.fillRect(0,0,WW,HH);
ctx.fillStyle='#ffe3a0';ctx.beginPath();ctx.arc(325,103,42,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff5b3';for(let i=0;i<45;i++)ctx.fillRect((i*137)%400,(i*89)%660,2,2);
ctx.fillStyle='#2d1744';for(let i=0;i<9;i++){let x=i*50;ctx.beginPath();ctx.moveTo(x-15,720);ctx.lineTo(x+10,570-(i%3)*30);ctx.lineTo(x+30,720);ctx.fill()}
textEmoji(level===1?'🏚️':level===2?'🌲':'🏰',80,170,60);textEmoji('🌙',330,110,38);ctx.fillStyle='#ffda82';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('LEVEL '+level+' / 3',200,112);
for(let i=0;i<4;i++){let y=floors[i];ctx.fillStyle='#5b3059';ctx.fillRect(8,y,384,19);ctx.fillStyle='#91c94b';ctx.fillRect(8,y-6,384,9);for(let x=20;x<390;x+=44){ctx.fillStyle='#ab6a46';ctx.fillRect(x,y+4,4,10)}}
for(const l of ladders){let bottom=floors[l.from],top=floors[l.from+1];ctx.strokeStyle='#e4b979';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(l.x-13,top);ctx.lineTo(l.x-13,bottom);ctx.moveTo(l.x+13,top);ctx.lineTo(l.x+13,bottom);ctx.stroke();ctx.lineWidth=3;for(let y=top+14;y<bottom;y+=17){ctx.beginPath();ctx.moveTo(l.x-12,y);ctx.lineTo(l.x+12,y);ctx.stroke()}}
for(const p of pumpkins)textEmoji('🎃',p.x,floors[p.f]-7,30);for(let i=0;i<4;i++){textEmoji('🕯️',25,floors[i]-9,19);textEmoji('🍂',375,floors[i]-8,21)}
for(const c of candies)if(!c.taken)textEmoji('🍬',c.x,floors[c.f]-24,27);for(const g of gems)if(!g.taken)textEmoji('💎',g.x,floors[g.f]-24,25);for(const h of hazards)textEmoji(h.type,h.x,floors[h.f]-8,26);
for(const m of monsters)textEmoji(m.type,m.x,floors[m.f]-8,30);
ctx.shadowColor='#f9e889';ctx.shadowBlur=22;textEmoji('🚪',44,210,39);ctx.shadowBlur=0;textEmoji('🏁',43,173,23);
if(player)ghost(player.x,player.y);if(mode==='menu'){ctx.fillStyle='#f2bc69';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('Boo’s Pumpkin Patch',200,55)}
}
function frame(now){try{let dt=Math.min((now-last)/1000||0,.05);last=now;if(mode==='play'){acc+=dt;let steps=0;while(acc>=1/120&&steps++<8){update(1/120);acc-=1/120;if(mode!=='play')break}}else acc=0;draw();}catch(err){document.getElementById('heading').textContent='Game loading error';document.getElementById('message').textContent=String(err);overlay.classList.remove('hidden');controls.classList.add('hidden');console.error(err)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
