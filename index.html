<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#2a123d"><title>Jump on the Ghost — Boo's Pumpkin Patch</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#261039;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;color:white;font-weight:800;text-shadow:0 2px 3px #261039;pointer-events:none}#hud span{background:#421b65bb;padding:9px 12px;border-radius:14px}button{font:800 20px system-ui;border:0;border-radius:20px;padding:13px 28px;color:white;background:#ed7a24}#pause{pointer-events:auto;font-size:20px;padding:8px 14px;background:#723d9a}#overlay{position:fixed;inset:0;background:#160b2ab9;display:flex;align-items:center;justify-content:center;color:white;text-align:center;padding:25px}#panel{background:#4c216d;border:3px solid #ffad4d;border-radius:28px;padding:25px;max-width:380px;width:100%;box-shadow:0 10px 40px #0008}h1{color:#ffc35e;font-size:34px;line-height:1.05;margin:0 0 15px}p{line-height:1.5}.hidden{display:none!important}</style></head>
<body><canvas id="game"></canvas><div id="hud"><span id="score">⭐ 0</span><span id="candy">🍬 0</span><button id="pause">Ⅱ</button></div><div id="overlay"><div id="panel"><h1>🎃 Jump on the Ghost!</h1><p>Meet Boo, the pink ghost!<br>Drag your finger left and right to bounce on platforms. Collect candy and dodge the bats!</p><p id="result"></p><button id="start">Play!</button></div></div>
<script>
(()=>{'use strict';
const c=document.querySelector('#game'),ctx=c.getContext('2d'),overlay=document.querySelector('#overlay'),start=document.querySelector('#start'),pause=document.querySelector('#pause'),scoreEl=document.querySelector('#score'),candyEl=document.querySelector('#candy'),result=document.querySelector('#result');
let W=400,H=700,dpr=1,boo,platforms=[],treats=[],bats=[],camera=0,highest=0,candies=0,score=0,running=false,paused=false,last=0,seed=0,target=null;
const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function reset(){camera=0;highest=0;candies=0;score=0;seed=0;target=null;platforms=[];treats=[];bats=[];boo={x:W/2,y:H-145,vx:0,vy:-650,r:20};platforms.push({x:W/2-65,y:H-75,w:130});while(seed<H*2){addPlatform()}running=true;paused=false;overlay.classList.add('hidden');last=performance.now()}
function addPlatform(){let y=H-155-seed;let w=rand(75,115);let x=rand(10,Math.max(11,W-w-10));platforms.push({x,y,w});if(seed>80&&Math.random()<.65)treats.push({x:x+w/2,y:y-42,taken:false});if(seed>400&&Math.random()<.24)bats.push({x:rand(35,W-35),y:y-75,phase:rand(0,6.28)});seed+=rand(75,115)}
function end(){running=false;overlay.classList.remove('hidden');document.querySelector('h1').textContent='👻 Boo! Game Over';result.textContent='Score: '+score+' • Candy: '+candies;start.textContent='Play Again'}
function move(x){target=x}c.addEventListener('pointerdown',e=>{move(e.clientX);c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX)});c.addEventListener('pointerup',()=>target=null);c.addEventListener('pointercancel',()=>target=null);
start.onclick=reset;pause.onclick=()=>{if(!running)return;paused=!paused;pause.textContent=paused?'▶':'Ⅱ'};
function drawGhost(x,y){ctx.save();ctx.translate(x,y);ctx.shadowColor='#ff9bd7';ctx.shadowBlur=20;ctx.fillStyle='#ffa9df';ctx.strokeStyle='#fff1fb';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-20,18);ctx.lineTo(-20,-3);ctx.arc(0,-3,20,Math.PI,0);ctx.lineTo(20,18);ctx.quadraticCurveTo(14,26,8,18);ctx.quadraticCurveTo(0,26,-7,18);ctx.quadraticCurveTo(-15,26,-20,18);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#30133e';ctx.beginPath();ctx.arc(-7,-4,3.5,0,7);ctx.arc(7,-4,3.5,0,7);ctx.fill();ctx.strokeStyle='#30133e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,4,5,0,Math.PI);ctx.stroke();ctx.restore()}
function draw(t){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1e103f');g.addColorStop(1,'#9a3b83');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ffe9a0';ctx.beginPath();ctx.arc(W*.77,H*.18,43,0,7);ctx.fill();ctx.fillStyle='#ffffff77';for(let i=0;i<42;i++){let x=((i*137)%W),y=((i*97)%H);ctx.fillRect(x,y,2,2)}
ctx.fillStyle='#2c1543';for(let i=0;i<11;i++){let x=i*W/10;ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x-13,H-55-(i%3)*15);ctx.lineTo(x+13,H-55-(i%3)*15);ctx.fill()}
for(const p of platforms){let y=p.y+camera;if(y< -40||y>H+50)continue;ctx.fillStyle='#442453';ctx.fillRect(p.x,y,p.w,18);ctx.fillStyle='#8fd849';ctx.beginPath();ctx.roundRect(p.x,y-7,p.w,13,6);ctx.fill();ctx.font='24px serif';if(p.w>90)ctx.fillText('🎃',p.x+10,y-8)}
ctx.font='26px serif';for(const a of treats)if(!a.taken){let y=a.y+camera;if(y>-30&&y<H+30)ctx.fillText('🍬',a.x-13,y+8)}
for(const b of bats){let y=b.y+camera;if(y>-40&&y<H+40){ctx.font='30px serif';ctx.fillText('🦇',b.x+Math.sin(t/500+b.phase)*25-16,y+12)}}
drawGhost(boo.x,boo.y+camera)}
function frame(t){let dt=Math.min((t-last)/1000||0,.035);last=t;if(running&&!paused){let prev=boo.y;let direction=target===null?0:Math.max(-1,Math.min(1,(target-boo.x)/45));boo.vx=direction*340;boo.x+=boo.vx*dt;boo.x=Math.max(20,Math.min(W-20,boo.x));boo.vy+=1450*dt;boo.y+=boo.vy*dt;
if(boo.vy>0)for(const p of platforms){if(prev+20<=p.y+10&&boo.y+20>=p.y&&boo.x+16>p.x&&boo.x-16<p.x+p.w){boo.y=p.y-20;boo.vy=-650;break}}
if(boo.y+camera<H*.38)camera=H*.38-boo.y;highest=Math.max(highest,H-145-boo.y);score=Math.max(0,Math.floor(highest/10))+candies*50;
for(const a of treats)if(!a.taken&&Math.hypot(boo.x-a.x,boo.y-a.y)<36){a.taken=true;candies++}
for(const b of bats)if(Math.hypot(boo.x-(b.x+Math.sin(t/500+b.phase)*25),boo.y-b.y)<29){end();break}
while(H-155-seed+camera>-100)addPlatform();
platforms=platforms.filter(p=>p.y+camera<H+60);treats=treats.filter(a=>a.y+camera<H+60&&!a.taken);bats=bats.filter(b=>b.y+camera<H+60);
if(boo.y+camera>H+40)end();scoreEl.textContent='⭐ '+score;candyEl.textContent='🍬 '+candies}
draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
